name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: future-site
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Linux native packages
        run: |
          ROLLUP_VERSION=$(node -p "require('rollup/package.json').version")
          SHARP_VERSION=$(node -p "require('./package.json').dependencies.sharp")
          SHARP_BINARY_VERSION=$(node -p "require('sharp/package.json').optionalDependencies['@img/sharp-linux-x64']")
          SHARP_LIBVIPS_VERSION=$(node -p "require('sharp/package.json').optionalDependencies['@img/sharp-libvips-linux-x64']")
          npm install --no-save --package-lock=false --include=optional --cpu=x64 --os=linux --libc=glibc \
            "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}" \
            "sharp@${SHARP_VERSION}" \
            "@img/sharp-linux-x64@${SHARP_BINARY_VERSION}" \
            "@img/sharp-libvips-linux-x64@${SHARP_LIBVIPS_VERSION}"
          node --input-type=module -e "import sharp from 'sharp'; console.log('Sharp Linux ready:', sharp.versions.sharp, 'libvips', sharp.versions.vips)"

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: future-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
